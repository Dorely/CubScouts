<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Representative 20-star United States flag</title>
  <desc id="desc">Thirteen red and white stripes with twenty white stars in a representative four-by-five row arrangement on a blue canton. Star arrangements were not yet standardized in 1818.</desc>
