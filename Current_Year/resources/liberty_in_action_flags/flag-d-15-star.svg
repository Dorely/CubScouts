<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Vector interpretation of the 15-star, 15-stripe United States flag</title>
  <desc id="desc">Fifteen stripes and fifteen stars in five staggered rows, inspired by the Star-Spangled Banner.</desc>
  <defs>
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309" fill="#f7edcf"/>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 1H8 M1 0V8" fill="none" stroke="#392f29" stroke-width="0.35" opacity="0.12"/></pattern>
    <clipPath id="flag-clip"><rect x="60" y="100" width="1080" height="600" rx="5"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="#f6f0e4"/>
  <rect x="54" y="106" width="1080" height="600" rx="5" fill="#2f2a24" opacity="0.14"/>
  <g clip-path="url(#flag-clip)">
    <rect x="60" y="100" width="1080" height="600" fill="#efe2c4"/>
    <g fill="#a33f36">
      <rect x="60" y="100" width="1080" height="40"/><rect x="60" y="180" width="1080" height="40"/>
      <rect x="60" y="260" width="1080" height="40"/><rect x="60" y="340" width="1080" height="40"/>
      <rect x="60" y="420" width="1080" height="40"/><rect x="60" y="500" width="1080" height="40"/>
      <rect x="60" y="580" width="1080" height="40"/><rect x="60" y="660" width="1080" height="40"/>
    </g>
    <rect x="60" y="100" width="450" height="320" fill="#243c56"/>
    <g>
      <use href="#star" transform="translate(145 145) scale(20)"/><use href="#star" transform="translate(285 145) scale(20)"/><use href="#star" transform="translate(425 145) scale(20)"/>
      <use href="#star" transform="translate(180 205) scale(20)"/><use href="#star" transform="translate(320 205) scale(20)"/><use href="#star" transform="translate(460 205) scale(20)"/>
      <use href="#star" transform="translate(145 265) scale(20)"/><use href="#star" transform="translate(285 265) scale(20)"/><use href="#star" transform="translate(425 265) scale(20)"/>
      <use href="#star" transform="translate(180 325) scale(20)"/><use href="#star" transform="translate(320 325) scale(20)"/><use href="#star" transform="translate(460 325) scale(20)"/>
      <use href="#star" transform="translate(145 385) scale(20)"/><use href="#star" transform="translate(285 385) scale(20)"/><use href="#star" transform="translate(425 385) scale(20)"/>
    </g>
    <rect x="60" y="100" width="1080" height="600" fill="url(#weave)"/>
  </g>
  <rect x="60" y="100" width="1080" height="600" rx="5" fill="none" stroke="#5e493b" stroke-width="3" opacity="0.7"/>
</svg>
