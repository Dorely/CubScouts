<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Vector interpretation of a 13-star United States flag</title>
  <desc id="desc">Thirteen stripes and thirteen stars in staggered rows of three and two, styled after surviving early American flags.</desc>
  <defs>
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309" fill="#f7edcf"/>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1H8 M1 0V8" fill="none" stroke="#392f29" stroke-width="0.35" opacity="0.12"/>
    </pattern>
    <clipPath id="flag-clip"><rect x="60" y="100" width="1080" height="600" rx="5"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="#f6f0e4"/>
  <rect x="54" y="106" width="1080" height="600" rx="5" fill="#2f2a24" opacity="0.14"/>
  <g clip-path="url(#flag-clip)">
    <rect x="60" y="100" width="1080" height="600" fill="#efe2c4"/>
    <g fill="#a33f36">
      <rect x="60" y="100" width="1080" height="46.154"/><rect x="60" y="192.308" width="1080" height="46.154"/>
      <rect x="60" y="284.616" width="1080" height="46.154"/><rect x="60" y="376.924" width="1080" height="46.154"/>
      <rect x="60" y="469.232" width="1080" height="46.154"/><rect x="60" y="561.540" width="1080" height="46.154"/>
      <rect x="60" y="653.846" width="1080" height="46.154"/>
    </g>
    <rect x="60" y="100" width="450" height="323.078" fill="#243c56"/>
    <g>
      <use href="#star" transform="translate(145 145) scale(22)"/><use href="#star" transform="translate(285 145) scale(22)"/><use href="#star" transform="translate(425 145) scale(22)"/>
      <use href="#star" transform="translate(215 205) scale(22)"/><use href="#star" transform="translate(355 205) scale(22)"/>
      <use href="#star" transform="translate(145 265) scale(22)"/><use href="#star" transform="translate(285 265) scale(22)"/><use href="#star" transform="translate(425 265) scale(22)"/>
      <use href="#star" transform="translate(215 325) scale(22)"/><use href="#star" transform="translate(355 325) scale(22)"/>
      <use href="#star" transform="translate(145 385) scale(22)"/><use href="#star" transform="translate(285 385) scale(22)"/><use href="#star" transform="translate(425 385) scale(22)"/>
    </g>
    <rect x="60" y="100" width="1080" height="600" fill="url(#weave)"/>
  </g>
  <rect x="60" y="100" width="1080" height="600" rx="5" fill="none" stroke="#5e493b" stroke-width="3" opacity="0.7"/>
</svg>
