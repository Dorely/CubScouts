<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Representative 13-star United States flag</title>
  <desc id="desc">Thirteen red and white stripes with thirteen white stars in a representative row arrangement on a blue canton. Star arrangements were not standardized in 1777.</desc>
  <defs>
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309" fill="#fff"/>
  </defs>
  <rect width="1900" height="1000" fill="#fff"/>
  <g fill="#B22234">
    <rect width="1900" height="76.923" y="0"/>
    <rect width="1900" height="76.923" y="153.846"/>
    <rect width="1900" height="76.923" y="307.692"/>
    <rect width="1900" height="76.923" y="461.538"/>
    <rect width="1900" height="76.923" y="615.385"/>
    <rect width="1900" height="76.923" y="769.231"/>
    <rect width="1900" height="76.923" y="923.077"/>
  </g>
  <rect width="760" height="538.462" fill="#3C3B6E"/>
  <g>
    <use href="#star" transform="translate(150 70) scale(34)"/>
    <use href="#star" transform="translate(380 70) scale(34)"/>
    <use href="#star" transform="translate(610 70) scale(34)"/>
    <use href="#star" transform="translate(265 170) scale(34)"/>
    <use href="#star" transform="translate(495 170) scale(34)"/>
    <use href="#star" transform="translate(150 270) scale(34)"/>
    <use href="#star" transform="translate(380 270) scale(34)"/>
    <use href="#star" transform="translate(610 270) scale(34)"/>
    <use href="#star" transform="translate(265 370) scale(34)"/>
    <use href="#star" transform="translate(495 370) scale(34)"/>
    <use href="#star" transform="translate(150 470) scale(34)"/>
    <use href="#star" transform="translate(380 470) scale(34)"/>
    <use href="#star" transform="translate(610 470) scale(34)"/>
  </g>
</svg>
